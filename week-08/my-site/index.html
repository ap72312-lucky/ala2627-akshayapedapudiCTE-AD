<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- DAY 1 · TODO 1: change the title to your topic -->
  <title>My Site</title>
  <link rel="stylesheet" href="styles.css">
  <!-- The console panel: shows console.log messages and errors at the bottom of the page,
       because school Chromebooks block the browser's own console.
       DAY 4: delete this one line before you ship, so your live site shows only your page. -->
  <script src="console-panel.js" defer></script>
  <!-- This line connects your JavaScript. "defer" means: wait until the page has loaded, then run it. Do not delete it. -->
  <script src="script.js" defer></script>
</head>
<body>
  <!--
    MY CONTRACT FOR THE WEEK  (DAY 1 · TODO 2 — fill in all four, then save)
    My topic:
    My colours:
    My headline:
    The one thing only my site does:
  -->

  <header class="top">
    <p class="kicker">Week 8 project</p>
    <!-- DAY 1 · TODO 3: your headline, in your own words -->
    <h1>Welcome to my site</h1>
    <!-- DAY 1 · TODO 4: one line that tells a stranger what this page is about -->
    <p class="tagline">Replace this with one line about your topic.</p>
  </header>

  <main class="cards">
    <section class="card">
      <h2>About</h2>
      <p>Replace this with two sentences about your topic.</p>
    </section>

    <section class="card feature">
      <h2>Try it</h2>
      <!-- DAY 2: this is your button. Its id, "action", is how JavaScript finds it. -->
      <button id="action" type="button">Click me</button>
      <!-- DAY 2: JavaScript writes into this paragraph. Its id is "output". -->
      <p id="output">Nothing has happened yet.</p>
    </section>

    <section class="card">
      <h2>Why it matters</h2>
      <p>Replace this with one reason someone should care about your topic.</p>
    </section>
  </main>

  <footer class="bottom">
    <p>Built in App Design 1.</p>
  </footer>
</body>
</html>
